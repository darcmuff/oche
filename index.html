<style>
:root{
  --slate:#F2ECDD; --slate-2:#E7DFCB; --ink:#1E2321; --ink-soft:#3F4541;
  --line:#A89B7E; --wire:#8E8778; --green:#1C6B45; --brass:#A5761B; --bust:#B3332B;
  --r:3px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --slate:#141A18; --slate-2:#1C2421; --ink:#EDE7D6; --ink-soft:#9AA39B;
    --line:#313B36; --wire:#6E7871; --green:#3E9B6C; --brass:#D9A441; --bust:#D6473C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --slate:#141A18; --slate-2:#1C2421; --ink:#EDE7D6; --ink-soft:#9AA39B;
  --line:#313B36; --wire:#6E7871; --green:#3E9B6C; --brass:#D9A441; --bust:#D6473C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--slate); color:var(--ink);
  font-family:Karla,"Segoe UI",system-ui,sans-serif; font-size:16px; line-height:1.4;
  -webkit-text-size-adjust:100%;
}
.app{
  height:100vh; height:100dvh; max-width:560px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
}
h1,h2,.num{font-family:Oswald,Impact,sans-serif;font-weight:500;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.hide{display:none !important}

/* masthead (setup only) */
.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px;flex:0 0 auto}
.mast h1{font-size:30px;line-height:1;letter-spacing:.02em}
.mast p{margin:0;font-size:14px;color:var(--ink-soft);font-style:italic;flex:1 1 100%;order:3}

/* setup */
#setup{overflow-y:auto;-webkit-overflow-scrolling:touch}
.field{margin-bottom:11px;flex:0 0 auto}
.field h2{font-size:13px;font-weight:400;color:var(--ink-soft);margin-bottom:6px;font-family:Karla,sans-serif;font-style:italic}
.games{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.game{padding:10px 11px;background:var(--slate-2);border:1px solid var(--line);border-radius:var(--r);text-align:left}
.game b{display:block;font-family:Oswald,sans-serif;font-size:19px;font-weight:500;line-height:1.1}
.game span{display:none;font-size:11.5px;color:var(--ink-soft);line-height:1.25;margin-top:2px}
.game[aria-pressed="true"] span{display:block;color:inherit;opacity:.72}
.game[aria-pressed="true"]{background:var(--ink);color:var(--slate);border-color:var(--ink);box-shadow:none}
.game[aria-pressed="true"] span{color:inherit;opacity:.72}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:48px;min-height:44px;padding:10px 8px;border:1px solid var(--line);background:var(--slate-2);border-radius:var(--r);font-family:Oswald,sans-serif;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--slate);border-color:var(--ink)}
.players{display:grid;gap:6px;margin-top:6px}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.roster.hide{display:none}
.roster button{padding:7px 11px;border:1px solid var(--line);background:var(--slate-2);border-radius:999px;font-size:13.5px;color:var(--ink)}
.roster button:active{background:var(--ink);color:var(--slate);border-color:var(--ink)}
.prow{display:flex;gap:8px;align-items:center}
.prow .pip{font-family:Oswald,sans-serif;color:var(--wire);width:14px;text-align:center}
input[type=text]{flex:1;min-width:0;padding:9px 11px;background:transparent;border:1px solid var(--line);border-bottom:2px solid var(--wire);border-radius:var(--r);color:var(--ink);font-size:16px}
.rulenote{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0}
.throw{width:100%;padding:15px;background:var(--ink);color:var(--slate);font-family:Oswald,sans-serif;font-size:21px;letter-spacing:.06em;border-radius:var(--r);flex:0 0 auto;margin-top:auto}
.resume{width:100%;padding:11px;margin-bottom:8px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r);font-size:15px;flex:0 0 auto}

/* match chrome */
.matchbar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px;flex:0 0 auto}
.matchbar button{min-width:44px;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:13.5px;background:var(--slate-2)}
.matchbar .title{font-family:Oswald,sans-serif;font-size:16px;letter-spacing:.02em;color:var(--ink-soft);text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* scoreboard */
#scoreboard{flex:0 0 auto}
.board{border-top:1px solid var(--line);border-bottom:2px solid var(--ink)}
.pl{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:none}
.pl.on{background:var(--slate-2);box-shadow:inset 7px 0 0 var(--brass)}
.pl .who{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl .legs{font-family:Oswald,sans-serif;color:var(--brass);font-size:13px}
.pl .rem{font-family:Oswald,sans-serif;line-height:.95;text-align:right;font-size:clamp(30px,7.2vh,52px)}
.pl .meta{grid-column:1/2;font-size:11.5px;color:var(--ink-soft);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.on .meta{color:var(--green);font-family:Oswald,Impact,sans-serif;font-weight:600;font-size:clamp(16px,2.8vh,20px);letter-spacing:.02em;min-height:1.15em;line-height:1.15}
.pl .avg{grid-column:2/3;text-align:right;font-size:11px;color:var(--ink-soft)}

/* controls fill the rest */
#controls{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.entry{font-family:Oswald,sans-serif;font-size:clamp(26px,5vh,40px);text-align:center;border:1px solid var(--line);border-bottom:3px solid var(--brass);background:var(--slate-2);border-radius:var(--r);flex:0 0 auto;padding:2px;min-height:46px;display:flex;align-items:center;justify-content:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:0 0 auto}
.quick button{min-height:44px;padding:10px 0;border:1px solid var(--line);border-radius:var(--r);font-family:Oswald,sans-serif;font-size:15px;background:var(--slate-2)}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:5px}
.pad button{padding:0;border:1px solid var(--line);border-radius:var(--r);font-family:Oswald,sans-serif;font-size:clamp(18px,3.4vh,26px);background:var(--slate-2)}
.pad .ok{background:var(--green);border-color:var(--green);color:#fff;grid-column:span 2}
.pad .clr{background:transparent;color:var(--ink-soft);border-color:var(--line);font-size:clamp(13px,2.2vh,17px)}
.pad .no{background:transparent;color:var(--bust);border-color:var(--bust);font-size:clamp(13px,2.2vh,17px);opacity:.85}

/* cricket */
.ckwrap{flex:1;min-height:0}
table.ck{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
table.ck th,table.ck td{border:1px solid var(--line);text-align:center;padding:0}
table.ck thead th{font-family:Karla,sans-serif;font-size:12px;font-weight:600;color:var(--ink-soft);padding:4px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.ck thead th.on{color:var(--brass)}
table.ck .tgt{font-family:Oswald,sans-serif;font-size:17px;width:52px;background:var(--slate-2)}
table.ck td.cell{font-family:Oswald,sans-serif;font-size:20px;letter-spacing:.06em;cursor:pointer}
table.ck td.cell.shut{color:var(--green)}
table.ck td.cell.live{background:color-mix(in srgb,var(--brass) 14%,transparent)}
table.ck tfoot td{font-family:Oswald,sans-serif;font-size:19px;background:var(--slate-2);height:34px}

/* clock */
.clockwrap{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.pclock{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;flex:0 0 auto}
.pclock.on{box-shadow:inset 4px 0 0 var(--brass);background:var(--slate-2)}
.pclock .hdr{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.clock{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:5px}
.clock div{border:1px solid var(--line);padding:4px 0;text-align:center;font-family:Oswald,sans-serif;font-size:12px;border-radius:2px}
.clock div.done{background:var(--green);border-color:var(--green);color:#fff}
.clock div.now{border-color:var(--brass);box-shadow:inset 0 -3px 0 var(--brass)}
.hitmiss{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:0 0 auto;height:clamp(58px,11vh,88px)}
.hitmiss button{border-radius:var(--r);font-family:Oswald,sans-serif;font-size:clamp(17px,3vh,22px);border:1px solid var(--line)}
.hitmiss .hit{background:var(--green);border-color:var(--green);color:#fff}
.handover{flex:0 0 auto;width:100%;padding:13px;border:1px solid var(--ink);background:var(--ink);color:var(--slate);border-radius:var(--r);font-family:Oswald,sans-serif;font-size:17px}

table.league{width:100%;border-collapse:collapse;margin-bottom:8px}
table.league th{font-family:Karla,sans-serif;font-size:11.5px;font-weight:400;font-style:italic;color:var(--ink-soft);text-align:right;padding:0 6px 4px;border-bottom:1px solid var(--line)}
table.league th:first-child{text-align:left}
table.league td{font-family:Oswald,sans-serif;font-size:17px;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
table.league td:first-child{text-align:left;font-family:Karla,sans-serif;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
table.league tr:first-child td{color:var(--brass)}
table.league tr:last-child td{border-bottom:none}
.tip{font-size:12.5px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--r);padding:8px 10px;margin:0 0 12px;line-height:1.35}
.clearbtn{border:1px solid var(--line);background:var(--slate-2);padding:7px 12px;border-radius:var(--r);font-size:13px;color:var(--ink-soft)}
.foot{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-top:4px}
.note{font-size:12.5px;color:var(--ink-soft);margin:0;text-align:center;flex:1;min-height:17px}
.abandon{font-size:12px;color:var(--bust);border:1px solid var(--bust);border-radius:var(--r);padding:4px 9px;flex:0 0 auto;opacity:.85}
.resumerow{display:flex;gap:6px;margin-bottom:8px}
.resumerow .resume{margin-bottom:0}
.win{text-align:center;padding:16px 12px;border:2px solid var(--brass);background:var(--slate-2);border-radius:var(--r);margin-bottom:8px;flex:0 0 auto}
.win h2{font-size:24px;line-height:1.1}
.win p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header class="mast" id="mast">
    <h1>DuffDarts</h1>
    <p>chalk it up</p>
  </header>

  <!-- SETUP -->
  <section id="setup" class="pane">
    <div class="resumerow hide" id="resumeRow">
      <button class="resume" id="resume">Resume the match in progress</button>
      <button class="abandon" id="dropMatch" style="padding:8px 12px">Bin it</button>
    </div>
    <p class="tip hide" id="tip"></p>

    <div class="field">
      <h2>Pick your game</h2>
      <div class="games" id="games"></div>
    </div>

    <div class="field" id="ruleField">
      <h2>House rules</h2>
      <div id="opts"></div>
    </div>

    <div class="field">
      <h2>Who's throwing</h2>
      <div class="seg" id="count"></div>
      <div class="players" id="players"></div>
      <div class="roster hide" id="roster"></div>
    </div>

    <button class="throw" id="start">Start the match</button>

    <div class="field hide" id="leagueWrap" style="margin-top:18px">
      <h2>League table — every match played on this phone</h2>
      <table class="league" id="league"></table>
      <button class="clearbtn" id="clearLeague">Clear the table</button>
    </div>
  </section>

  <!-- MATCH -->
  <section id="match" class="pane hide">
    <div class="matchbar">
      <button id="back">‹ Games</button>
      <span class="title" id="gname"></span>
      <button id="undo">Undo</button>
    </div>
    <div id="winner" class="hide"></div>
    <div id="scoreboard"></div>
    <div id="controls"></div>
    <div class="foot">
      <p class="note" id="note"></p>
      <button class="abandon" id="abandon">Abandon</button>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";

var GAMES = [
  {id:"501", name:"501", blurb:"Straight in. The proper one."},
  {id:"301", name:"301", blurb:"Shorter. Fewer excuses."},
  {id:"cricket", name:"Cricket", blurb:"Shut 20 down to 15, then the bull."},
  {id:"clock", name:"Round the clock", blurb:"1 to 20, then the bull."}
];
var CK_TARGETS = [20,19,18,17,16,15,25];

/* checkout finder */
var DARTS=(function(){var a=[];for(var i=1;i<=20;i++){a.push({v:i,n:"S"+i,d:false});a.push({v:i*2,n:"D"+i,d:true});a.push({v:i*3,n:"T"+i,d:false});}a.push({v:25,n:"25",d:false});a.push({v:50,n:"Bull",d:true});return a;})();
var DOUBLES=DARTS.filter(function(x){return x.d;});
var PREF=["D20","D16","D8","D10","D12","D4","D18","D2","D14","D6","D1","D19","D17","D15","D13","D11","D9","D7","D5","D3","Bull"];
function fancy(d){ return d.n.charAt(0)==="S" ? 0 : 1; }
function one(d){ return d.n.charAt(0)==="S" ? d.n.slice(1) : d.n; }
function fmt(p){ return p.map(one).join(" "); }
function byV(a,b){ return b.v-a.v; }

/* double out: fewest darts, then a friendly finishing double, then a big first dart */
var doMemo={};
function checkout(n){
  if(n<2||n>170) return null;
  if(doMemo[n]!==undefined) return doMemo[n];
  var best=null;
  function cost(d){ var c=d.n.charAt(0); return c==="S"?0:((d.n==="Bull"||d.n==="25")?3:1); }
  function rate(p){
    var i=PREF.indexOf(p[p.length-1].n); if(i<0) i=99;
    var pen=0; for(var x=0;x<p.length-1;x++) pen+=cost(p[x]);
    return p.length*100000 + pen*100 + i*10 - (p[0].v/100);
  }
  function take(p){if(!best||rate(p)<rate(best))best=p;}
  var i,j,k;
  for(i=0;i<DOUBLES.length;i++) if(DOUBLES[i].v===n) take([DOUBLES[i]]);
  if(!best) for(i=0;i<DARTS.length;i++) for(j=0;j<DOUBLES.length;j++) if(DARTS[i].v+DOUBLES[j].v===n) take([DARTS[i],DOUBLES[j]]);
  if(!best) for(i=0;i<DARTS.length;i++){ if(DARTS[i].v+2>n) continue;
    for(j=0;j<DARTS.length;j++) for(k=0;k<DOUBLES.length;k++) if(DARTS[i].v+DARTS[j].v+DOUBLES[k].v===n) take([DARTS[i],DARTS[j],DOUBLES[k]]); }
  doMemo[n]=best?fmt(best):null;
  return doMemo[n];
}

/* straight out: plain singles wherever they'll do, then fewest darts, biggest dart first */
var soMemo={};
function straightOut(n){
  if(n<1||n>180) return null;
  if(soMemo[n]!==undefined) return soMemo[n];
  var best=null;
  function fc(a){var c=0,x;for(x=0;x<a.length;x++)c+=fancy(a[x]);return c;}
  function better(a,b){
    if(!b) return true;
    var fa=fc(a), fb=fc(b);
    if(fa!==fb) return fa<fb;
    if(a.length!==b.length) return a.length<b.length;
    for(var i=0;i<a.length;i++) if(a[i].v!==b[i].v) return a[i].v>b[i].v;
    return false;
  }
  var L=DARTS.length,i,j,k,s2,c;
  for(i=0;i<L;i++){
    if(DARTS[i].v===n){ c=[DARTS[i]]; if(better(c,best)) best=c; }
    for(j=i;j<L;j++){
      s2=DARTS[i].v+DARTS[j].v;
      if(s2===n){ c=[DARTS[i],DARTS[j]].sort(byV); if(better(c,best)) best=c; }
      if(s2>=n) continue;
      for(k=j;k<L;k++) if(s2+DARTS[k].v===n){ c=[DARTS[i],DARTS[j],DARTS[k]].sort(byV); if(better(c,best)) best=c; }
    }
  }
  soMemo[n]=best?fmt(best):null;
  return soMemo[n];
}

var LKEY="oche:league";
function loadLeague(){ try{ var r=localStorage.getItem(LKEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveLeague(t){ try{ localStorage.setItem(LKEY,JSON.stringify(t)); }catch(e){} }
function lkey(n){ return n.trim().toLowerCase(); }
function record(winnerName){
  var t=loadLeague();
  M.p.forEach(function(p){
    var k=lkey(p.name); if(!k) return;
    var row=t[k]||{name:p.name,played:0,won:0};
    row.name=p.name; row.played++;
    if(p.name===winnerName) row.won++;
    t[k]=row;
  });
  saveLeague(t); M.recorded=true;
}
function unrecord(winnerName){
  var t=loadLeague();
  M.p.forEach(function(p){
    var k=lkey(p.name), row=t[k]; if(!row) return;
    row.played=Math.max(0,row.played-1);
    if(p.name===winnerName) row.won=Math.max(0,row.won-1);
    if(row.played===0) delete t[k]; else t[k]=row;
  });
  saveLeague(t); M.recorded=false;
}
function standing(name){
  var row=loadLeague()[lkey(name)];
  return row? row.won+" from "+row.played : null;
}
function drawLeague(){
  var t=loadLeague(), rows=Object.keys(t).map(function(k){return t[k];});
  if(!rows.length){ el("leagueWrap").classList.add("hide"); drawRoster(); return; }
  el("leagueWrap").classList.remove("hide");
  rows.sort(function(a,b){ return (b.won-a.won) || (b.won/b.played - a.won/a.played) || (b.played-a.played); });
  el("league").innerHTML='<thead><tr><th>Player</th><th>Played</th><th>Won</th><th>Win rate</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td>'+r.name+'</td><td>'+r.played+'</td><td>'+r.won+'</td><td>'+Math.round(r.won/r.played*100)+'%</td></tr>';
    }).join("")+'</tbody>';
  drawRoster();
}

var setup={game:"501",names:["Marc","Player 2"],doubleOut:true,legs:3};
var M=null, entry="", KEY="oche:match", NKEY="oche:names";
function el(id){return document.getElementById(id);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(M));}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function wipe(){try{localStorage.removeItem(KEY);}catch(e){}}
function loadNames(){
  try{
    var r=localStorage.getItem(NKEY); if(!r) return null;
    var a=JSON.parse(r);
    if(Array.isArray(a)&&a.length>=1&&a.length<=4) return a.map(function(n){return String(n);});
  }catch(e){}
  return null;
}
function saveNames(){ try{ localStorage.setItem(NKEY,JSON.stringify(setup.names)); }catch(e){} }
(function(){ var n=loadNames(); if(n) setup.names=n; })();
function snap(){M.history.push(JSON.stringify({p:M.p,turn:M.turn,starter:M.starter,over:M.over,winner:M.winner}));if(M.history.length>60)M.history.shift();}

/* ---- setup ---- */
function drawGames(){
  el("games").innerHTML=GAMES.map(function(g){
    return '<button class="game" data-g="'+g.id+'" aria-pressed="'+(setup.game===g.id)+'"><b>'+g.name+'</b><span>'+g.blurb+'</span></button>';
  }).join("");
}
function drawCount(){
  el("count").innerHTML=[1,2,3,4].map(function(n){
    return '<button data-c="'+n+'" aria-pressed="'+(setup.names.length===n)+'">'+n+(n===1?" player":" players")+'</button>';
  }).join("");
}
function drawPlayers(){
  el("players").innerHTML=setup.names.map(function(n,i){
    return '<div class="prow"><span class="pip">'+(i+1)+'</span><input type="text" data-i="'+i+'" value="'+String(n).replace(/"/g,"&quot;")+'" placeholder="Name" autocomplete="nickname"></div>';
  }).join("");
  drawRoster();
}
function drawRoster(){
  var wrap=el("roster"); if(!wrap) return;
  var used={}; setup.names.forEach(function(n){ var k=lkey(n); if(k) used[k]=1; });
  var t=loadLeague();
  var chips=Object.keys(t).map(function(k){return t[k].name;}).filter(function(n){
    return n && !used[lkey(n)];
  }).sort(function(a,b){
    var A=t[lkey(a)]||{played:0,won:0}, B=t[lkey(b)]||{played:0,won:0};
    return (B.won-A.won)||(B.played-A.played)||a.localeCompare(b);
  });
  if(!chips.length){ wrap.classList.add("hide"); wrap.innerHTML=""; return; }
  wrap.classList.remove("hide");
  wrap.innerHTML=chips.map(function(n){
    return '<button type="button" data-rn="'+String(n).replace(/"/g,"&quot;")+'">'+String(n).replace(/</g,"&lt;")+'</button>';
  }).join("");
}
function applyRosterName(name){
  name=(name||"").trim(); if(!name) return;
  var i, slot=-1;
  for(i=0;i<setup.names.length;i++){
    var cur=(setup.names[i]||"").trim();
    if(!cur || /^Player\s*\d+$/i.test(cur)){ slot=i; break; }
  }
  if(slot<0){
    if(setup.names.length<4){ setup.names.push(name); }
    else return;
  } else {
    setup.names[slot]=name;
  }
  saveNames(); drawCount(); drawPlayers();
}
function drawOpts(){
  var o=el("opts");
  if(setup.game==="501"||setup.game==="301"){
    o.innerHTML=
      '<div class="seg" style="margin-bottom:6px">'+
        '<button data-do="1" aria-pressed="'+(setup.doubleOut)+'">Double out</button>'+
        '<button data-do="0" aria-pressed="'+(!setup.doubleOut)+'">Straight out</button>'+
      '</div>'+
      '<div class="seg">'+[1,2,3,5,7].map(function(n){
        return '<button data-l="'+n+'" aria-pressed="'+(setup.legs===n)+'">'+n+' leg'+(n>1?"s":"")+'</button>';}).join("")+'</div>'+
      '<p class="rulenote">'+(setup.doubleOut?"Last dart must land in a double or the bull.":"Any dart that hits zero wins the leg.")+' First to '+setup.legs+' leg'+(setup.legs>1?"s":"")+' takes the match.</p>';
  } else if(setup.game==="cricket"){
    o.innerHTML='<p class="rulenote">Tap a number to chalk a mark. Three marks shuts it, and after that you score on it until everyone else shuts it too. Board shut with the most points wins.</p>';
  } else {
    o.innerHTML='<p class="rulenote">Three darts a visit. Hit your number to move up. First to close the bull wins, and the app counts your darts so you can chase your own record.</p>';
  }
}
drawGames(); drawCount(); drawPlayers(); drawOpts(); drawLeague();

(function(){
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  if(standalone) return;
  try{ if(localStorage.getItem("oche:tip")==="off") return; }catch(e){}
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  var t=el("tip");
  t.innerHTML = "Keep it on your phone: " + (ios
    ? "tap Share, then <b>Add to Home Screen</b>."
    : "open the browser menu, then <b>Install app</b> or <b>Add to Home screen</b>.") +
    " It opens full screen, no browser bars. <button class=\"clearbtn\" id=\"tipOff\" style=\"margin-top:6px;display:block\">Got it</button>";
  t.classList.remove("hide");
  el("tipOff").addEventListener("click",function(){
    t.classList.add("hide");
    try{ localStorage.setItem("oche:tip","off"); }catch(e){}
  });
})();

(function(){
  var btn=el("clearLeague"), backup=null, t=null;
  btn.addEventListener("click",function(){
    if(backup){
      clearTimeout(t); saveLeague(backup); backup=null;
      btn.textContent="Clear the table"; drawLeague(); return;
    }
    backup=loadLeague(); saveLeague({}); drawLeague();
    btn.classList.remove("hide"); el("leagueWrap").classList.remove("hide");
    el("league").innerHTML="";
    btn.textContent="Undo that";
    t=setTimeout(function(){ backup=null; btn.textContent="Clear the table"; drawLeague(); },8000);
  });
})();

el("games").addEventListener("click",function(e){var b=e.target.closest(".game");if(!b)return;setup.game=b.dataset.g;drawGames();drawOpts();});
el("opts").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.do!==undefined) setup.doubleOut=b.dataset.do==="1";
  if(b.dataset.l!==undefined) setup.legs=+b.dataset.l;
  drawOpts();
});
el("count").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var n=+b.dataset.c;
  while(setup.names.length<n) setup.names.push("Player "+(setup.names.length+1));
  setup.names.length=n;
  saveNames(); drawCount(); drawPlayers();
});
el("players").addEventListener("input",function(e){ if(e.target.dataset.i!==undefined){ setup.names[+e.target.dataset.i]=e.target.value; saveNames(); drawRoster(); } });
el("roster").addEventListener("click",function(e){ var b=e.target.closest("button[data-rn]"); if(!b) return; applyRosterName(b.dataset.rn); });
el("start").addEventListener("click",begin);
el("resume").addEventListener("click",function(){ var s=load(); if(s){ M=s; M.history=M.history||[]; show(); } });

/* ---- wake lock (keep screen on in a match) ---- */
var wake=null;
function keepAwake(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(lock){
    wake=lock;
    wake.addEventListener('release',function(){ wake=null; });
  }).catch(function(){});
}
function letSleep(){
  if(wake){ try{ wake.release(); }catch(e){} wake=null; }
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible' && M && !el('match').classList.contains('hide')) keepAwake();
});

/* ---- match ---- */
function begin(){
  var names=setup.names.map(function(n,i){return (n||"").trim()||("Player "+(i+1));});
  var start=setup.game==="301"?301:501;
  M={game:setup.game,doubleOut:setup.doubleOut,legsTarget:setup.legs,start:start,
     turn:0,starter:0,over:null,winner:null,recorded:false,msg:"",history:[],
     p:names.map(function(n){return {name:n,score:start,legs:0,darts:0,scored:0,marks:{},pts:0,tgt:1,visit:0};})};
  setup.names=names.slice(); saveNames();
  entry=""; show(); save();
}
function label(){
  if(M.game==="cricket") return "Cricket";
  if(M.game==="clock") return "Round the clock";
  return M.start+" · "+(M.doubleOut?"double out":"straight out")+" · first to "+M.legsTarget;
}
function show(){
  el("mast").classList.add("hide");
  el("setup").classList.add("hide");
  el("match").classList.remove("hide");
  el("gname").textContent=label();
  render();
  keepAwake();
}
function toSetup(){
  letSleep();
  el("mast").classList.remove("hide");
  el("match").classList.add("hide");
  el("setup").classList.remove("hide");
  el("resumeRow").classList.toggle("hide", !(M && !M.over));
  drawLeague();
}
function dropMatch(){ M=null; wipe(); toSetup(); }
el("abandon").addEventListener("click",dropMatch);
el("dropMatch").addEventListener("click",dropMatch);
el("back").addEventListener("click",function(){ if(M&&!M.over) save(); else wipe(); toSetup(); });
el("undo").addEventListener("click",function(){
  if(!M||!M.history.length){ M.msg="Nothing left to undo."; render(); return; }
  var s=JSON.parse(M.history.pop());
  M.p=s.p; M.turn=s.turn; M.starter=s.starter; M.over=s.over; M.winner=s.winner; M.msg="Undone.";
  entry=""; render(); save();
});
function next(){ M.turn=(M.turn+1)%M.p.length; }

function submitScore(){
  if(M.over) return;
  var v=parseInt(entry,10);
  if(isNaN(v)){ M.msg="Tap a score first."; render(); return; }
  if(v>180){ M.msg="180 is the maximum. Nice try."; entry=""; render(); return; }
  snap();
  var p=M.p[M.turn], rem=p.score-v;
  var bust = rem<0 || (M.doubleOut && rem===1);
  p.darts+=3;
  if(bust){ M.msg=p.name+" bust on "+v+"."; next(); }
  else if(rem===0){
    p.scored+=v; p.score=0; p.legs++;
    if(p.legs>=M.legsTarget){ M.winner=p.name; M.over=p.name+" takes the match"; }
    else{
      M.msg=p.name+" takes the leg.";
      M.starter=(M.starter+1)%M.p.length; M.turn=M.starter;
      M.p.forEach(function(q){q.score=M.start;});
    }
  } else {
    p.scored+=v; p.score=rem;
    M.msg = v===180 ? "One hundred and eighty." : (v>=100? p.name+" hit "+v+"." : "");
    next();
  }
  entry=""; render(); save();
}
function ckMark(pi,t){
  if(M.over) return;
  if(pi!==M.turn){ M.msg="It's "+M.p[M.turn].name+"'s throw."; render(); return; }
  snap();
  var p=M.p[pi], have=p.marks[t]||0;
  if(have<3){ p.marks[t]=have+1; }
  else{
    var allShut=M.p.every(function(q,i){return i===pi||(q.marks[t]||0)>=3;});
    if(allShut){ M.history.pop(); M.msg="Everyone's shut "+(t===25?"the bull":t)+" — no points there."; render(); return; }
    p.pts+=t;
  }
  p.darts++;
  var done=CK_TARGETS.every(function(x){return (p.marks[x]||0)>=3;});
  var top=Math.max.apply(null,M.p.map(function(q){return q.pts;}));
  if(done&&p.pts>=top){ M.winner=p.name; M.over=p.name+" shuts the board"; }
  M.msg=""; render(); save();
}
function ckNext(){ if(M.over) return; snap(); next(); M.msg=""; render(); save(); }
function clockThrow(hit){
  if(M.over) return;
  snap();
  var p=M.p[M.turn]; p.darts++; p.visit++;
  if(hit){ p.tgt++; if(p.tgt>21){ M.winner=p.name; M.over=p.name+" closes the bull in "+p.darts+" darts"; } }
  if(!M.over&&p.visit>=3){ p.visit=0; next(); }
  M.msg=""; render(); save();
}

/* ---- render ---- */
function avg(p){ return p.darts? (p.scored/p.darts*3).toFixed(1)+" avg" : ""; }
function render(){
  var sb=el("scoreboard"), ct=el("controls"), w=el("winner");
  if(M.over){
    if(!M.recorded){ record(M.winner); }
    var rec=standing(M.winner);
    w.className="win";
    w.innerHTML='<h2>'+M.over+'</h2><p>Game shot'+(rec?" — "+M.winner+" now "+rec:"")+'. Tap “Games” to set up another.</p>';
  }
  else {
    if(M.recorded && M.winner) unrecord(M.winner);
    w.className="hide"; w.innerHTML="";
  }
  if(M.game==="cricket") renderCricket(sb,ct);
  else if(M.game==="clock") renderClock(sb,ct);
  else renderX01(sb,ct);
  el("note").textContent=M.msg||"";
  el("abandon").textContent = M.over ? "Clear" : "Abandon";
}
function renderX01(sb,ct){
  sb.innerHTML='<div class="board">'+M.p.map(function(p,i){
    var on=i===M.turn&&!M.over;
    var co=M.doubleOut?checkout(p.score):straightOut(p.score);
    var lim=M.doubleOut?170:180;
    var meta=on?(co?"Checkout: "+co:(p.score>lim?"":"No way out from "+p.score)):"";
    return '<div class="pl'+(on?" on":"")+'">'+
      '<div class="who">'+p.name+(M.legsTarget>1?' <span class="legs">'+p.legs+' / '+M.legsTarget+'</span>':'')+'</div>'+
      '<div class="rem num">'+p.score+'</div>'+
      '<div class="meta">'+meta+'</div><div class="avg">'+avg(p)+'</div></div>';
  }).join("")+'</div>';
  if(M.over){ ct.innerHTML=""; return; }
  ct.innerHTML='<div class="entry" id="entry">'+(entry===""?"&nbsp;":entry)+'</div>'+
    '<div class="quick">'+[26,41,45,60,81,100,140,180].map(function(n){return '<button data-q="'+n+'">'+n+'</button>';}).join("")+'</div>'+
    '<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-k="'+n+'">'+n+'</button>';}).join("")+
      '<button data-k="0">0</button><button class="clr" data-k="c">Clear</button>'+
      '<button class="no" data-k="b">No score</button><button class="ok" data-k="e">Enter</button></div>';
}
function renderCricket(sb,ct){
  sb.innerHTML="";
  var head='<tr><th></th>'+M.p.map(function(p,i){return '<th class="'+(i===M.turn&&!M.over?"on":"")+'">'+p.name+'</th>';}).join("")+'</tr>';
  var rows=CK_TARGETS.map(function(t){
    return '<tr><td class="tgt">'+(t===25?"Bull":t)+'</td>'+M.p.map(function(p,i){
      var m=p.marks[t]||0, s=m===0?"·":(m===1?"/":(m===2?"✕":"⊗"));
      return '<td class="cell'+(m>=3?" shut":"")+(i===M.turn&&!M.over?" live":"")+'" data-p="'+i+'" data-t="'+t+'">'+s+'</td>';
    }).join("")+'</tr>';}).join("");
  var foot='<tr><td class="tgt" style="font-size:12px">Points</td>'+M.p.map(function(p){return '<td>'+p.pts+'</td>';}).join("")+'</tr>';
  ct.innerHTML='<div class="ckwrap"><table class="ck"><thead>'+head+'</thead><tbody>'+rows+'</tbody><tfoot>'+foot+'</tfoot></table></div>'+
    (M.over?"":'<button class="handover" id="ckNext">Hand over to '+M.p[(M.turn+1)%M.p.length].name+'</button>');
}
function renderClock(sb,ct){
  sb.innerHTML="";
  var cards=M.p.map(function(p,i){
    var on=i===M.turn&&!M.over, cells="";
    for(var n=1;n<=21;n++) cells+='<div class="'+(p.tgt>n?"done":"")+(p.tgt===n&&on?" now":"")+'">'+(n===21?"B":n)+'</div>';
    return '<div class="pclock'+(on?" on":"")+'"><div class="hdr"><span>'+p.name+'</span><span>'+p.darts+' darts</span></div>'+
      '<div class="clock">'+cells+'</div></div>';
  }).join("");
  ct.innerHTML='<div class="clockwrap">'+cards+'</div>'+
    (M.over?"":'<div class="hitmiss"><button class="hit" data-h="1">Hit '+(M.p[M.turn].tgt===21?"bull":M.p[M.turn].tgt)+'</button><button data-h="0">Missed</button></div>');
  if(!M.over) M.msg="Dart "+(M.p[M.turn].visit+1)+" of 3 — "+M.p[M.turn].name;
}

/* ---- input ---- */
el("controls").addEventListener("click",function(e){
  var c=e.target.closest("td.cell");
  if(c){ ckMark(+c.dataset.p,+c.dataset.t); return; }
  var b=e.target.closest("button"); if(!b) return;
  if(b.id==="ckNext"){ ckNext(); return; }
  if(b.dataset.h!==undefined){ clockThrow(b.dataset.h==="1"); return; }
  if(b.dataset.q!==undefined){ entry=b.dataset.q; submitScore(); return; }
  var k=b.dataset.k; if(k===undefined) return;
  if(k==="c"){ entry=""; M.msg=""; render(); }
  else if(k==="b"){ entry="0"; submitScore(); }
  else if(k==="e"){ submitScore(); }
  else { if(entry.length<3){ entry=(entry+k).replace(/^0+(?=\d)/,""); } el("entry").textContent=entry||" "; }
});
document.addEventListener("keydown",function(e){
  if(!M||el("match").classList.contains("hide")) return;
  if(M.game!=="501"&&M.game!=="301") return;
  if(document.activeElement&&document.activeElement.tagName==="INPUT") return;
  if(/^[0-9]$/.test(e.key)){ if(entry.length<3) entry=(entry+e.key).replace(/^0+(?=\d)/,""); render(); }
  else if(e.key==="Enter"){ e.preventDefault(); submitScore(); }
  else if(e.key==="Backspace"){ entry=entry.slice(0,-1); render(); }
});

/* ---- resume ---- */
var saved=load();
if(saved&&saved.p&&saved.p.length&&!saved.over) el("resumeRow").classList.remove("hide");

/* ---- offline ---- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    if(reg.waiting){ try{ reg.waiting.postMessage({type:"SKIP_WAITING"}); }catch(e){} }
    reg.update();
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    /* new SW took over — one reload to pick up fresh HTML */
    if(window.__ocheReloaded) return;
    window.__ocheReloaded=true;
    location.reload();
  });
}
})();
</script>
</body>
</html>
